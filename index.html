<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Galería Pinatarius 2026 — todas las fotos</title>
<meta name="description" content="Todas las fotos de la carrera Pinatarius 2026, sin repeticiones. Visualiza y descarga tus fotos." />
<link rel="preconnect" href="https://paraisodeportivosanpedrodelpinatar.com" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1>Pinatarius 2026</h1>
      <p class="subtitle"><span id="count">…</span> fotos</p>
    </div>
    <div class="controls">
      <input id="search" type="search" inputmode="numeric" placeholder="Buscar por nº de foto (ej. 312)" autocomplete="off" />
      <button id="downloadFavs" class="btn" title="Descargar favoritas">
        <svg class="ic" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M8 1a.75.75 0 0 1 .75.75v6.69l2.22-2.22a.75.75 0 1 1 1.06 1.06l-3.5 3.5a.75.75 0 0 1-1.06 0l-3.5-3.5a.75.75 0 1 1 1.06-1.06l2.22 2.22V1.75A.75.75 0 0 1 8 1Z"/><path fill="currentColor" d="M2.75 10a.75.75 0 0 1 .75.75v2.5c0 .138.112.25.25.25h8.5a.25.25 0 0 0 .25-.25v-2.5a.75.75 0 0 1 1.5 0v2.5A1.75 1.75 0 0 1 12.25 15h-8.5A1.75 1.75 0 0 1 2 13.25v-2.5A.75.75 0 0 1 2.75 10Z"/></svg>
        <span class="star">★</span><span class="btn-text">Descargar favoritas</span>
      </button>
    </div>
  </div>
</header>

<main>
  <div id="filters" class="filters"></div>
  <div id="grid" class="grid" aria-live="polite"></div>
  <p id="empty" class="empty hidden">No hay fotos que coincidan.</p>
</main>

<!-- Lightbox -->
<div id="lb" class="lb hidden" role="dialog" aria-modal="true" aria-label="Visor de foto">
  <button class="lb-close" id="lbClose" aria-label="Cerrar">&times;</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Anterior">&#10094;</button>
  <button class="lb-nav lb-next" id="lbNext" aria-label="Siguiente">&#10095;</button>
  <div class="lb-viewport" id="lbViewport">
    <div class="lb-track" id="lbTrack">
      <img class="lb-slide" id="lbPrevImg" alt="" decoding="async" />
      <img class="lb-slide" id="lbImg" alt="" decoding="async" />
      <img class="lb-slide" id="lbNextImg" alt="" decoding="async" />
    </div>
  </div>
  <figcaption class="lb-caption">
    <span id="lbLabel"></span>
    <button id="lbFav" class="btn" aria-pressed="false">☆ Favorita</button>
    <button id="lbShare" class="btn">Compartir</button>
    <a id="lbDownload" class="btn btn-primary" download>Descargar foto</a>
  </figcaption>
</div>

<button id="toTop" class="to-top hidden" aria-label="Volver arriba" title="Volver arriba">↑</button>

<div id="toast" class="toast hidden"></div>

<footer class="footer">
  <p><strong>Web no oficial.</strong> Hecha por un random que participó en la carrera y quería tener sus fotos ya. Las fotos pertenecen a sus autores y al organizador, y se sirven desde <a href="https://paraisodeportivosanpedrodelpinatar.com" target="_blank" rel="noopener">paraisodeportivosanpedrodelpinatar.com</a>.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
