<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 180px; height: 180px; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    /* full-bleed: iOS aplica su propia máscara redondeada */
    background: linear-gradient(180deg, #1b2230, #0d1117);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  body::before, body::after {
    content: ""; position: absolute; top: 40px;
    width: 8px; height: 8px; border-radius: 50%; background: #8b949e;
  }
  body::before { left: 56px; }
  body::after  { right: 56px; }
  span {
    font-size: 74px; font-weight: 800; letter-spacing: -5px; color: #fff;
  }
</style>
</head>
<body><span>P26</span></body>
</html>
