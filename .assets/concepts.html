<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1180px; height: 360px; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0d1117;
    display: flex; align-items: center; justify-content: center; gap: 34px;
    padding: 30px;
  }
  .item { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .tile { width: 132px; height: 132px; }
  .label { color: #e6edf3; font-size: 19px; font-weight: 600; }
  .num { color: #2f81f7; font-weight: 800; }
  svg { display: block; width: 132px; height: 132px; }
</style>
</head>
<body>

  <!-- 1. PIN DE MAPA (lugar: San Pedro del PINatar) -->
  <div class="item">
    <svg viewBox="0 0 64 64">
      <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1b2230"/><stop offset="1" stop-color="#0d1117"/></linearGradient></defs>
      <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#g1)" stroke="#30363d" stroke-width="2"/>
      <path d="M32 14c-7.2 0-13 5.6-13 12.7 0 9 13 22.3 13 22.3s13-13.3 13-22.3C45 19.6 39.2 14 32 14z" fill="#2f81f7"/>
      <circle cx="32" cy="26.5" r="5.2" fill="#0d1117"/>
    </svg>
    <div class="label"><span class="num">1.</span> Pin de mapa</div>
  </div>

  <!-- 2. CÁMARA (es una galería de fotos) -->
  <div class="item">
    <svg viewBox="0 0 64 64">
      <defs><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1b2230"/><stop offset="1" stop-color="#0d1117"/></linearGradient></defs>
      <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#g2)" stroke="#30363d" stroke-width="2"/>
      <rect x="13" y="22" width="38" height="26" rx="5" fill="#e6edf3"/>
      <rect x="25" y="17" width="14" height="7" rx="2" fill="#e6edf3"/>
      <circle cx="32" cy="35" r="8.5" fill="#0d1117"/>
      <circle cx="32" cy="35" r="4.6" fill="#2f81f7"/>
    </svg>
    <div class="label"><span class="num">2.</span> Cámara</div>
  </div>

  <!-- 3. PILA DE FOTOS -->
  <div class="item">
    <svg viewBox="0 0 64 64">
      <defs><linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1b2230"/><stop offset="1" stop-color="#0d1117"/></linearGradient></defs>
      <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#g3)" stroke="#30363d" stroke-width="2"/>
      <rect x="20" y="16" width="30" height="30" rx="4" fill="#2f81f7" transform="rotate(9 35 31)"/>
      <rect x="15" y="20" width="30" height="30" rx="4" fill="#e6edf3"/>
      <circle cx="23" cy="28" r="3.2" fill="#2f81f7"/>
      <path d="M20 44l7-8 5 5 6-7 7 10z" fill="#0d1117"/>
    </svg>
    <div class="label"><span class="num">3.</span> Pila de fotos</div>
  </div>

  <!-- 4. MONOGRAMA P -->
  <div class="item">
    <svg viewBox="0 0 64 64">
      <defs><linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#2f81f7"/><stop offset="1" stop-color="#1f6feb"/></linearGradient></defs>
      <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#g4)"/>
      <text x="32" y="46" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
            font-size="42" font-weight="800" fill="#fff">P</text>
    </svg>
    <div class="label"><span class="num">4.</span> Monograma P</div>
  </div>

  <!-- 5. MOVIMIENTO (chevrons) -->
  <div class="item">
    <svg viewBox="0 0 64 64">
      <defs><linearGradient id="g5" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1b2230"/><stop offset="1" stop-color="#0d1117"/></linearGradient></defs>
      <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#g5)" stroke="#30363d" stroke-width="2"/>
      <g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 22l10 10-10 10" stroke="#1f6feb"/>
        <path d="M32 22l10 10-10 10" stroke="#2f81f7"/>
        <path d="M44 22l4 4-4 4" stroke="#e6edf3" opacity="0.85"/>
      </g>
    </svg>
    <div class="label"><span class="num">5.</span> Movimiento</div>
  </div>

</body>
</html>
