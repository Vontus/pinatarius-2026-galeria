<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e6edf3;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(47,129,247,0.18), transparent 60%),
      linear-gradient(160deg, #161b22 0%, #0d1117 60%);
    position: relative;
    overflow: hidden;
  }
  /* patrón de puntos sutil */
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1.5px, transparent 1.5px);
    background-size: 26px 26px;
    mask-image: linear-gradient(160deg, rgba(0,0,0,0.9), transparent 70%);
  }
  .wrap {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 76px 80px;
  }
  /* dorsal */
  .bib {
    width: 132px; height: 132px;
    border-radius: 30px;
    background: linear-gradient(180deg, #1b2230, #0d1117);
    border: 6px solid #2f81f7;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    box-shadow: 0 18px 50px rgba(0,0,0,0.5);
    margin-bottom: 40px;
  }
  .bib::before, .bib::after {
    content: ""; position: absolute; top: 22px;
    width: 9px; height: 9px; border-radius: 50%; background: #8b949e;
  }
  .bib::before { left: 30px; }
  .bib::after  { right: 30px; }
  .bib span {
    font-size: 52px; font-weight: 800; letter-spacing: -3px; color: #fff;
  }
  h1 {
    font-size: 92px; font-weight: 800; letter-spacing: -3px; line-height: 1;
  }
  .sub {
    margin-top: 22px;
    font-size: 38px; font-weight: 600; color: #2f81f7;
  }
  .meta {
    margin-top: 18px;
    font-size: 27px; color: #8b949e;
  }
  .url {
    position: absolute; left: 80px; bottom: 56px;
    font-size: 22px; color: #6e7681; letter-spacing: 0.3px;
  }
</style>
</head>
<body>
  <div class="dots"></div>
  <div class="wrap">
    <div class="bib"><span>P26</span></div>
    <h1>Pinatarius 2026</h1>
    <div class="sub">Galería completa de fotos · +9000 imágenes</div>
    <div class="meta">Busca por número · Visor a pantalla completa · Descarga en ZIP</div>
    <div class="url">Galería no oficial</div>
  </div>
</body>
</html>
